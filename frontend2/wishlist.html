<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESCAPE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="/static/js/auth.js"></script>
    <script type="module" src="/static/js/infosUtilisateurs.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/static/js/wishlist.js"></script>

    <style>
        /* .glass-background {
            background-image: url("static/img/bc.jpeg");
            background-repeat: no-repeat;
            background-size: cover;
            backdrop-filter: blur(5px);
        }
        .glass-background::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }
        .glass-background * {
            z-index: 2;
        } */
        .glass {
            background-color: rgb(255, 255, 255);
            opacity: 0.1;
            display: contents;
        }
    
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hoverBook {
            height: 282px;
            align-items: center;
            overflow-y: auto;
            scrollbar-width: thin; 
            scrollbar-color: white transparent; 
            scrollbar-width: initial;
        }
    
    
        .hoverBook div:hover {
            transform: scale(1.1);
        }
    
        .hoverBook::-webkit-scrollbar {
            width: 30px;
        }
    
        .hoverBook::-webkit-scrollbar-track {
            background: white; 
            border-radius: 10px;
        }
    
        .hoverBook::-webkit-scrollbar-thumb {
            background: #2a2a2a; 
            border-radius: 10px;
            transition: background 0.3s;
        }
    
        .hoverBook::-webkit-scrollbar-thumb:hover {
            background: #2a2a2a; 
        }
        
    
        .hoverBook {
        display: flex;
        gap: 20px;
        overflow-x: auto;
        scroll-behavior: smooth;
        padding-bottom: 10px;
    }
    
    /* Personnalisation de la scrollbar */
    .hoverBook::-webkit-scrollbar {
        height: 8px;
    }
    
    .hoverBook::-webkit-scrollbar-track {
        background: transparent;
    }
    
    .hoverBook::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 10px;
    }
    
    .hoverBook::-webkit-scrollbar-thumb:hover {
        background: #555;
    }
    
    .book-card {
        flex: 0 0 auto;
        width: 120px;
        text-align: center;
    }
    
    .book-card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 8px;
        transition: transform 0.2s ease-in-out;
    }
    
    .book-card:hover img {
        transform: scale(1.1);
    }
    
    
    </style>
</head>
<body class="bg-gray-900 text-white glass-background">

    <!-- Contenu de la page -->
    <div id="content" class="min-h-screen">
        <div class="glass">
            <!-- HEADER -->
            <nav class="bg-gray-800/80 backdrop-blur-md py-4 px-10 flex items-center justify-between w-full shadow-md z-10 fixed top-0">
                <div class="w-[20%]"><a href="/#"><img src="/static/img/bigboss_logo.png" class="w-10 h-auto" alt="Logo BookFlix"></a></div>
                
                <!-- Barre de recherche -->
                <div class="flex-1 flex justify-center w-[60%]">
                    <input type="text" placeholder="Rechercher..."
                        class="w-full max-w-lg px-4 py-2 rounded-full border border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-400 bg-gray-700 text-white">
                </div>

                <!-- Menu Utilisateur -->
                <div class="header-acc flex items-center justify-end space-x-4 gap-4 w-[20%]">
                    <a href="/static/dejalu.html" class="hover:text-red-400 text-white">Mes Livres</a>
                    <a href="/static/wishlist.html" class="hover:text-red-400 text-white">Ma Wishlist</a>

                    <!-- GESTION UTILISATEUR -->
                    <div class="relative" x-data="{ open: false }" >
                        <template x-if="localStorage.getItem('user_id')">
                            <div class="flex items-end">
                                <button @click="open = !open" @click.outside="open = false" class="focus:outline-none br">
                                    <img src="/static/img/user_icon.png" class="w-8 h-8 rounded-full">
                                </button>
                                <div x-show="open" x-cloak x-transition 
                                class="fixed right-4 top-16 w-48 bg-gray-700 rounded-lg shadow-lg overflow-hidden z-50">
                            
                                    <div class="p-2 text-white">
                                        <p class="text-center font-bold" x-text="JSON.parse(localStorage.getItem('user_data'))?.name"></p>
                                        <button onclick="showUserInfo()" class="w-full text-left px-4 py-2 hover:bg-gray-600">
                                            📄 Mes informations
                                        </button>
                                        <button class="w-full text-left px-4 py-2 hover:bg-gray-600"
                                            @click="localStorage.removeItem('user_id'); localStorage.removeItem('user_data'); location.reload();">
                                            🚪 Déconnexion
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template x-if="!localStorage.getItem('user_id')">
                            <a href="#" id="monCompte" onclick="stockagePagePrecedente()" class="hover:text-red-400 text-white">Connexion</a>
                        </template>
                    </div>
                </div>
            </nav>
        </div>

        <section class="p-6 mt-20" x-data>
            <!-- Barre de recherche -->
            <div class="flex justify-center space-x-4 mb-6">
                <select x-model="$store.bookList.selectedGenre" class="px-4 py-2 rounded bg-gray-700 border border-gray-600 text-white">
                    <option value="">Tous les genres</option>
                    <template x-for="genre in $store.bookList.genres" :key="genre">
                        <option x-text="genre"></option>
                    </template>
                </select>
                <input type="text" x-model="$store.bookList.searchAuthor" placeholder="Rechercher un auteur..." class="px-4 py-2 rounded bg-gray-700 border border-gray-600 text-white">
                <input type="text" x-model="$store.bookList.searchTitle" placeholder="Rechercher un titre..." class="px-4 py-2 rounded bg-gray-700 border border-gray-600 text-white">
            </div>
        
            <!-- Liste des livres lus -->
            <h2 class="text-xl font-bold mb-4">Livres à lire</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-2">
                <template x-for="book in $store.bookList.filteredBooks" :key="book.id">
                    <div class="book-card flex flex-col items-center w-full p-2">
                        <img :src="book.url !== '-1' ? book.url : '/static/notfound.jpg'" 
                            alt="Couverture de livre" 
                            class="w-[150px] h-[225px] object-cover rounded-lg shadow-md"> 
                        <h3 class="text-sm text-center mt-2 font-medium w-full h-[100px] overflow-hidden text-ellipsis whitespace-normal line-clamp-5"
                            x-text="book.title"></h3>
                        <button @click="$store.bookList.bookread(book.id)" class="mt-3 px-3 py-1 rounded-full bg-green-500 hover:bg-green-700 text-white flex items-center space-x-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                            <span>Livre lu</span>
                        </button>
                                        
                        <button @click="$store.bookList.removeWishlist(book.id)" class="mt-3 px-3 py-1 rounded-full bg-red-500 hover:bg-red-700 text-white flex items-center space-x-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                            <span>Retirer</span>
                        </button>
                    </div>
                </template>
            </div>
        </section>
        
        
        
        
    </div>

    <!-- MODALE INFOS UTILISATEUR -->
    <div id="userInfoModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 hidden">
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg w-96 relative">
            <h2 class="text-xl font-bold mb-4">Informations du compte</h2>
            <p><strong>Nom :</strong> <span id="userName"></span></p>
            <p><strong>Âge :</strong> <span id="userAge"></span></p>
            <p><strong>Enfants :</strong> <span id="userChild"></span></p>
            <p><strong>Situation familiale :</strong> <span id="userFamily"></span></p>
            <p><strong>Genre :</strong> <span id="userGender"></span></p>
            <p><strong>Catégorie socio-pro :</strong> <span id="userSocioPro"></span></p>
            <p><strong>Lieu d'habitation :</strong> <span id="userLocation"></span></p>
            <p><strong>Fréquence :</strong> <span id="userFrequency"></span></p>
            <p><strong>Taille du livre préféré :</strong> <span id="userBookSize"></span></p>
            <p><strong>Date de naissance :</strong> <span id="userBirthDate"></span></p>

            <button onclick="hideUserInfo()" 
                    class="mt-4 w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded">
                Fermer
            </button>
        </div>

        
    </div>

     <footer class="bg-gray-800/80 backdrop-blur-md py-4 px-10 flex items-center justify-between w-full shadow-md">
        <div class="w-[20%]">
            <img src="/static/img/bigboss_logo.png" class="w-10 h-auto" alt="Logo BookFlix">
        </div>
        <p class="w-[60%] text-center">&copy; 2025 BookFlix - Tous droits réservés</p>
        <div class="header-acc flex gap-4 w-[20%] justify-end">
            <a href="#" class="hover:text-red-400 text-white">Accueil</a>
            <a href="dejalu.html" class="hover:text-red-400 text-white">Installation</a>
            <a href="#" class="hover:text-red-400 text-white">Contact</a>
        </div>
    </footer>


    
</body>
</html>
