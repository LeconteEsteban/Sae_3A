<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="/static/js/auth.js"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-6 rounded-2xl shadow-lg w-96 relative">
        <h2 class="text-2xl font-bold text-center text-white mb-4">Connexion Administrateur</h2>
        <form id="adminLoginForm" class="mt-6 space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-white">Identifiant</label>
                <input type="text" id="username" name="username" class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400 text-white" required>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-white">Mot de passe</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400 text-white" required>
            </div>
            <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">
                Connexion Admin
            </button>
        </form>
    </div>
</body>
</html>
